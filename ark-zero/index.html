<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARKZERO</title>
  <link rel="stylesheet" href="./styles.css?v=19">
</head>
<body>
  <div class="app-shell">
    <aside class="hud" aria-label="调查状态">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <strong>方舟零号</strong>
          <span>继承审查系统</span>
        </div>
      </div>

      <div class="meters">
        <div class="meter">
          <div class="meter-head"><span>继承资格</span><b id="inheritanceValue">50</b></div>
          <div class="meter-track"><i id="inheritanceBar"></i></div>
        </div>
        <div class="meter">
          <div class="meter-head"><span>战争倾向</span><b id="warValue">0</b></div>
          <div class="meter-track"><i id="warBar"></i></div>
        </div>
        <div class="meter">
          <div class="meter-head"><span>记忆同步</span><b id="memoryValue">0</b></div>
          <div class="meter-track"><i id="memoryBar"></i></div>
        </div>
      </div>

      <div class="log-panel">
        <div class="panel-title">调查记录</div>
        <ul id="recordList"></ul>
      </div>

      <button class="ghost-button" id="restartButton" type="button">重新开始</button>
    </aside>

    <main class="stage">
      <section class="visual-zone" aria-label="场景画面">
        <img id="sceneImage" alt="">
        <video id="sceneVideo" playsinline muted preload="metadata"></video>
        <canvas id="gpuFxCanvas" class="gpu-fx-canvas" aria-hidden="true"></canvas>
        <button class="cutscene-skip" id="cutsceneSkip" type="button" hidden>跳过片段</button>
        <div class="scanlines"></div>
      </section>

      <section class="story-zone">
        <div class="chapter-label" id="sceneChapter"></div>
        <h1 id="sceneTitle"></h1>
        <div class="media-controls" id="mediaControls" hidden>
          <span id="mediaBadge">视频片段已加载</span>
          <button id="videoToggle" type="button">暂停片段</button>
          <button id="muteToggle" type="button">静音</button>
        </div>
        <div id="sceneText" class="scene-text"></div>
        <blockquote id="aiComment"></blockquote>
        <div class="story-tools">
          <button id="archiveButton" type="button">打开方舟资料库</button>
          <span id="archiveHint">档案会随调查逐步解锁</span>
        </div>
        <div class="choice-grid" id="choices"></div>
      </section>
        <div class="gesture-gate" id="gestureGate" hidden>
          <div class="gesture-head">
            <span>ARK ACCESS</span>
            <strong>准入手势验证</strong>
          </div>
          <div class="gesture-viewport">
            <video id="gestureVideo" autoplay playsinline muted></video>
            <canvas id="gestureCanvas"></canvas>
          </div>
          <div class="gesture-status" id="gestureStatus">请启动识别，并依次展示：握拳 -> 完全伸展手掌。</div>
          <div class="gesture-steps">
            <span id="fistStep">1 握拳</span>
            <span id="palmStep">2 张开手掌</span>
          </div>
          <div class="gesture-actions">
            <button id="startGesture" type="button">启动准入识别</button>
          </div>
        </div>
      <div class="glory-cutscene" id="gloryCutscene" hidden>
        <img id="gloryImage" alt="旧日人类辉煌档案">
        <div class="glory-vignette"></div>
        <div class="glory-caption">
          <span id="gloryKicker">MINERVA ARCHIVE</span>
          <h2 id="gloryTitle"></h2>
          <p id="gloryNarration"></p>
          <div class="glory-progress"><i id="gloryProgress"></i></div>
        </div>
        <button class="glory-skip" id="glorySkip" type="button">跳过档案</button>
      </div>    </main>
  </div>

  <dialog class="ai-dialog" id="aiDialog">
    <div class="ai-dialog-layout">
      <img src="星舰ai概念图/img_ai_normal.jpg" alt="弥涅尔瓦-0">
      <div>
        <div class="dialog-head">
          <div>
            <span>MINERVA-0</span>
            <h2>弥涅尔瓦-0</h2>
          </div>
          <button class="icon-button" id="closeAi" type="button" aria-label="关闭">x</button>
        </div>
        <div class="qa-list" id="qaList"></div>
        <div class="chat-box">
          <div class="chat-stream" id="chatStream" aria-live="polite">
            <div class="chat-message ai">自由提问已接入舰载 AI。公网版本会优先连接安全代理；代理暂不可用时，将使用本地角色档案回复。</div>
          </div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" name="message" autocomplete="off" maxlength="220" placeholder="向弥涅尔瓦-0自由提问...">
            <button type="submit">发送</button>
          </form>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="lore-dialog" id="loreDialog">
    <div class="dialog-head">
      <div>
        <span>ARK ARCHIVE</span>
        <h2 id="loreTitle">资料库</h2>
      </div>
      <button class="icon-button" id="closeLore" type="button" aria-label="关闭">x</button>
    </div>
    <div id="loreBody" class="lore-body"></div>
  </dialog>

  <script src="./config.js"></script>
  <script src="./game.js?v=19"></script>
</body>
</html>
